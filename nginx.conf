server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for hashed assets (regex locations take priority over prefix)
    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html or config.js when requested explicitly
    location ~* ^/(index\.html|config\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # SPA fallback — also never cached so browsers always get fresh index.html
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
